[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=2MB
logfile_backups=2
pidfile=/run/supervisord.pid
user=root

; 容器内也能用 supervisorctl 单独重启 xvfb / x11vnc，不用整容器重启
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; priority 小的先启动：Xvfb → x11vnc/websockify → 主程序
;
; 2026-11-23 修复（docker restart 后整套浏览器失效）：
;   docker restart 不重建容器，/tmp 里上一次 Xvfb 留下的 /tmp/.X99-lock 和
;   /tmp/.X11-unix/X99 还在。新 Xvfb 看到锁就报
;   "Fatal server error: Server is already active for display 99" 并 exit 1，
;   supervisord 重试 4 次后 FATAL。连锁后果：
;     · x11vnc 没有 display → 也 exit 1（5900 不监听）
;       → noVNC 画面「无法连接到服务器」
;     · chromium 没有 DISPLAY → 启动即退出（defunct）
;       → 调试端口 9300~9304 永远不起来 → 百应巡检「浏览器启动超时：端口没有起来」
;   启动前清掉陈旧锁文件即可自愈（容器重建时 /tmp 本来就是干净的，删不存在的文件无副作用）。
[program:xvfb]
command=/bin/sh -c "rm -f /tmp/.X99-lock /tmp/.X11-unix/X99; exec Xvfb :99 -screen 0 1600x900x24 -nolisten tcp"
autorestart=true
startsecs=2
startretries=10
priority=10

; 等 Xvfb 的 socket 出现再连，避免抢跑失败
[program:x11vnc]
command=/bin/sh -c "i=0; while [ $i -lt 60 ] && [ ! -S /tmp/.X11-unix/X99 ]; do i=$((i+1)); sleep 0.5; done; exec x11vnc -display :99 -forever -shared -rfbport 5900 -nopw -quiet"
autorestart=true
startsecs=2
startretries=10
priority=20

[program:websockify]
command=websockify --web /usr/share/novnc 6080 localhost:5900
autorestart=true
startsecs=2
startretries=10
priority=20

[program:app]
command=uvicorn server.main:app --host 0.0.0.0 --port 8000
directory=/app
autorestart=true
startsecs=3
startretries=10
stopsignal=TERM
stopwaitsecs=25
priority=30
environment=DISPLAY=":99",DS_DATA_DIR="/data",CHROME_PATH="/usr/bin/chromium"
