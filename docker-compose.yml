services:
  liangqie:
    image: ghcr.io/frank3101/liangqie-studio:latest
    container_name: liangqie-web
    ports:
      - "8000:8000"      # 操作界面
      - "6080:6080"      # 浏览器画面（扫码登录）
      - "8443:8443"      # 企微回调（不用企微可不映射）
    volumes:
      - /data:/data                            # 必须：账号、登录态、配置
      - /mnt/media1:/mnt/media1                # 可选：素材目录
      - /mnt/media2:/mnt/media2                # 可选：申诉材料
    environment:
      - TZ=Asia/Shanghai
      - DS_EXTRA_ROOTS=/mnt/media1:/mnt/media2          # 和上面 target 保持一致
      - DS_NOVNC_URL=
    shm_size: "1gb"
    restart: unless-stopped
