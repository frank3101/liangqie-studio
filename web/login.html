<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登录 · 亮切工坊</title>
<link rel="icon" type="image/png" href="app_icon.png">
<style>
  :root{
    --bg:#F6F1EA; --card:#FFFFFF; --line:#E8E0D5;
    --text:#2C2C2A; --muted:#888780; --accent:#E24B4A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--text);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:16px;
  }
  .box{
    width:100%;max-width:340px;background:var(--card);
    border:1px solid var(--line);border-radius:16px;
    padding:34px 28px 28px;text-align:center;
  }
  .box img{width:72px;height:72px;border-radius:18px;margin-bottom:12px}
  h1{font-size:18px;font-weight:600;margin-bottom:4px}
  .sub{font-size:12px;color:var(--muted);margin-bottom:22px}
  input{
    width:100%;height:42px;border:1px solid var(--line);border-radius:10px;
    padding:0 14px;font-size:14px;margin-bottom:12px;outline:none;background:#FAFAF8;
  }
  input:focus{border-color:var(--accent);background:#fff}
  button{
    width:100%;height:42px;border:0;border-radius:10px;cursor:pointer;
    background:var(--accent);color:#fff;font-size:14px;font-weight:500;
  }
  button:active{opacity:.85}
  .err{font-size:12px;color:var(--accent);min-height:16px;margin-bottom:6px}
  .tip{font-size:11px;color:var(--muted);margin-top:14px}
  @media (max-width:400px){ .box{padding:26px 20px 22px} }
</style>
</head>
<body>
  <form class="box" onsubmit="return go(event)">
    <img src="app_icon.png" alt="亮切工坊">
    <h1>亮切工坊</h1>
    <div class="sub" id="sub">输入密码进入</div>
    <div class="err" id="err"></div>
    <input type="password" id="pw" placeholder="密码" autocomplete="current-password" autofocus>
    <input type="password" id="pw2" placeholder="再输入一遍" style="display:none" autocomplete="new-password">
    <button id="btn" type="submit">进入</button>
    <div class="tip">登录后 30 天内免输密码</div>
  </form>
<script>
const err = document.getElementById("err");
const pw2 = document.getElementById("pw2");
const sub = document.getElementById("sub");
const btn = document.getElementById("btn");
let setting = false;

fetch("/api/auth_state").then(r => r.json()).then(s => {
  if (!s.has_password) {
    setting = true;
    sub.textContent = "首次使用，请设置一个密码";
    pw.placeholder = "设置密码";
    pw2.style.display = "";
    btn.textContent = "保存并进入";
  }
}).catch(() => {});

async function go(e) {
  e.preventDefault();
  err.textContent = "";
  btn.disabled = true;
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({password: document.getElementById("pw").value,
                            confirm: pw2.value})
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok) { location.href = "/"; return false; }
    err.textContent = d.detail || "登录失败";
    btn.disabled = false;
  } catch (_) {
    err.textContent = "网络错误，稍后再试";
    btn.disabled = false;
  }
  return false;
}
</script>
</body>
</html>
